<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="figures.css">
<style>
/* Composed from real screenshots: the example apps side by side on a desktop. */
.fig { padding: 0; }
.desk { position: absolute; inset: 0; overflow: hidden; }
.desk .window { position: absolute; }
#chess { left: 26px; top: 50px; width: 600px; }
#paint { left: 420px; top: 150px; width: 470px; }
#hello { left: 92px; top: 372px; width: 250px; }
#calc { right: 34px; top: 64px; width: 200px; }
.dock { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); }
.dock img { width: 50px; height: 50px; }
</style>
</head>
<body>
<div class="fig wallpaper">
  <div class="desk">
    <div class="menubar">
      <svg class="apple" viewBox="0 0 14 16" aria-hidden="true"><path fill="#111" d="M11.6 8.5c0-1.9 1.6-2.8 1.6-2.9-.9-1.3-2.2-1.5-2.7-1.5-1.2-.1-2.3.7-2.8.7-.6 0-1.5-.7-2.5-.7C3.9 4.1 2.7 4.9 2 6.1.6 8.5 1.6 12 3 14c.7 1 1.4 2 2.5 2 1 0 1.4-.7 2.6-.7s1.5.7 2.6.6c1.1 0 1.8-1 2.4-2 .8-1.1 1.1-2.2 1.1-2.3 0 0-2.6-1-2.6-3.1zM9.6 2.7c.5-.7.9-1.6.8-2.5-.8 0-1.7.5-2.3 1.2-.5.6-.9 1.5-.8 2.4.9.1 1.8-.4 2.3-1.1z"/></svg>
      <b>Paint</b><span>File</span><span>Edit</span><span>View</span><span>Image</span><span>Colors</span><span>Window</span><span>Help</span>
      <span class="right">Mon 19 Oct  11:24</span>
    </div>
    <div class="window" id="chess"><img src="shots/chess.png" alt=""></div>
    <div class="window" id="hello"><img src="shots/hello.png" alt=""></div>
    <div class="window" id="paint"><img src="shots/paint.png" alt=""></div>
    <div class="window" id="calc"><img src="shots/calculator.png" alt=""></div>
    <div class="dock">
      <figure><img src="assets/icon-calculator.png" alt=""><i class="run"></i></figure>
      <figure><img src="assets/icon-chessresults.png" alt=""><i class="run"></i></figure>
      <figure><span class="label">Paint</span><img src="assets/icon-paint.png" alt=""><i class="run"></i></figure>
      <figure><img src="assets/icon-hello.png" alt=""><i class="run"></i></figure>
    </div>
  </div>
</div>
</body>
</html>
